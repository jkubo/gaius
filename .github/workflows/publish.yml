name: Publish to PyPI

# Trusted Publishing (OIDC) -- no stored API token.
#
# One-time setup on PyPI before this works:
#   https://pypi.org/manage/account/publishing/  -> add a pending publisher:
#     PyPI project name : gaius-memory
#     Owner             : jkubo
#     Repository name   : gaius
#     Workflow name     : publish.yml
#     Environment       : pypi
#   Then create a GitHub Environment named "pypi" in this repo's settings.
#
# Trigger: publish a GitHub Release (tag it vX.Y.Z first). CI builds from THIS
# repo, which is already the OSS-scrubbed mirror, so no internal refs ship.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Guard -- refuse to publish if internal refs leaked into artifacts
        # Mirrors the Makefile's HARD leak scan: domains, cluster hostnames,
        # private IPs, home paths, private repo roots, and the internal-only
        # council-sync command. Keep the two patterns in sync -- this one is the
        # last gate before a PERMANENT PyPI artifact, so it must not be the weaker.
        # Soft identifiers are accepted public vocabulary -- the drift webhook
        # command is a real gaius feature.
        #
        # Scans BOTH artifacts. The sdist is built by setuptools' default file
        # discovery, which sweeps in tests/ even with no MANIFEST.in and
        # packages.find include=["gaius*"] -- an earlier version of this comment
        # asserted the opposite and used it to justify not scanning fixtures.
        # Verify with `tar tzf dist/*.tar.gz` before trusting any claim about
        # scope. The wheel carries the package data (presets, skill templates)
        # and is what most users actually install, so it is scanned too.
        #
        # Every step below distinguishes "looked and found nothing" from "never
        # looked": missing artifacts and a zero-file extraction both fail the job.
        # Without that, a glob that does not expand makes the pipeline return
        # grep's own not-found status and the release publishes unscanned.
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz); wheels=(dist/*.whl)
          if [ ${#sdists[@]} -eq 0 ] || [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::expected an sdist and a wheel in dist/, found: ${sdists[*]:-none} ${wheels[*]:-none}"
            exit 1
          fi
          work=$(mktemp -d)
          for f in "${sdists[@]}"; do tar xzf "$f" -C "$work"; done
          for f in "${wheels[@]}"; do unzip -q -o "$f" -d "$work"; done
          n=$(find "$work" -type f | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::extracted 0 files from the artifacts -- the guard never looked, refusing to publish"
            exit 1
          fi
          echo "scanning $n extracted file(s) from ${#sdists[@]} sdist(s) + ${#wheels[@]} wheel(s)"
          hits=$(grep -rIaEn 'kub0\.(net|io)|k8s-(aus|hnd|lax|toa)-|10\.(250|42|43)\.|100\.(64|67)\.|/home/[a-z]+/|(~|\$HOME)/(ansible|\.ssh)|Projects/(agent-memory|Brain)|kub0-ai|sync-council' "$work" || true)  # leak-scan:allow -- this IS the pattern
          hits=$(printf '%s\n' "$hits" | grep -Fv 'leak-scan:allow' | grep -v '^$' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::internal reference found in build artifacts; scrub failed, refusing to publish"
            exit 1
          fi
          echo "artifact leak scan: clean"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
