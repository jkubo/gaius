name: Publish to PyPI

# Trusted Publishing (OIDC) -- no stored API token.
#
# One-time setup on PyPI before this works:
#   https://pypi.org/manage/account/publishing/  -> add a pending publisher:
#     PyPI project name : gaius-memory
#     Owner             : jkubo
#     Repository name   : gaius
#     Workflow name     : publish.yml
#     Environment       : pypi
#   Then create a GitHub Environment named "pypi" in this repo's settings.
#
# Trigger: publish a GitHub Release (tag it vX.Y.Z first). CI builds from THIS
# repo, which is already the OSS-scrubbed mirror, so no internal refs ship.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Guard -- refuse to publish if internal refs leaked into artifacts
        # Mirrors the Makefile's HARD leak scan: domains, cluster hostnames,
        # private IPs, home paths, private repo roots, and the internal-only
        # sync-council command. Keep the two patterns in sync -- this one is the
        # last gate before a PERMANENT PyPI artifact, so it must not be the weaker.
        # Soft identifiers (claudeus/council/http_adapter) are accepted public
        # vocabulary -- the `drift --post-council` command is a real gaius feature.
        #
        # NOTE: this guard only sees what the sdist CONTAINS. There is no
        # MANIFEST.in and packages.find is include=["gaius*"], so tests/ is NOT in
        # the sdist -- a leak in a fixture is invisible here and must be caught by
        # the Makefile scan and the test.yml CI scan, both of which now cover tests/.
        run: |
          if tar xzf dist/*.tar.gz -O | grep -aiE 'kub0\.(net|io)|k8s-(aus|hnd|lax|toa)-|10\.(250|42|43)\.|100\.(64|67)\.|/home/[a-z]+/|(~|\$HOME)/(ansible|\.ssh)|Projects/(agent-memory|Brain)|kub0-ai|sync-council'; then  # leak-scan:allow -- this IS the pattern
            echo "::error::internal reference found in sdist; scrub failed, refusing to publish"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
