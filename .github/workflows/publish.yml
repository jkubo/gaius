name: Publish to PyPI

# Trusted Publishing (OIDC) -- no stored API token.
#
# One-time setup on PyPI before this works:
#   https://pypi.org/manage/account/publishing/  -> add a pending publisher:
#     PyPI project name : gaius-memory
#     Owner             : jkubo
#     Repository name   : gaius
#     Workflow name     : publish.yml
#     Environment       : pypi
#   Then create a GitHub Environment named "pypi" in this repo's settings.
#
# Trigger: publish a GitHub Release (tag it vX.Y.Z first). CI builds from THIS
# repo, which is already the OSS-scrubbed mirror, so no internal refs ship.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pin full commit SHAs (mutable tags rejected by supply-chain residual).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Guard -- refuse to publish if internal refs leaked into artifacts
        # Mirrors the maintainer-side HARD leak scan: it loads the SAME encoded
        # denylist (.github/leak-patterns.b64, `core`) plus the artifact-only
        # extras (`artifact`), so the two cannot drift apart -- this one is the
        # last gate before a PERMANENT PyPI artifact, so it must not be the weaker.
        # Soft identifiers are accepted public vocabulary and are deliberately not
        # in this gate; they are surfaced for review at publish time instead.
        #
        # Scans BOTH artifacts. The sdist is built by setuptools' default file
        # discovery, which sweeps in tests/ even with no MANIFEST.in and
        # packages.find include=["gaius*"] -- an earlier version of this comment
        # asserted the opposite and used it to justify not scanning fixtures.
        # Verify with `tar tzf dist/*.tar.gz` before trusting any claim about
        # scope. The wheel carries the package data (presets, skill templates)
        # and is what most users actually install, so it is scanned too.
        #
        # Every step below distinguishes "looked and found nothing" from "never
        # looked": missing artifacts and a zero-file extraction both fail the job.
        # Without that, a glob that does not expand makes the pipeline return
        # grep's own not-found status and the release publishes unscanned.
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdists=(dist/*.tar.gz); wheels=(dist/*.whl)
          if [ ${#sdists[@]} -eq 0 ] || [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::expected an sdist and a wheel in dist/, found: ${sdists[*]:-none} ${wheels[*]:-none}"
            exit 1
          fi
          work=$(mktemp -d)
          for f in "${sdists[@]}"; do tar xzf "$f" -C "$work"; done
          for f in "${wheels[@]}"; do unzip -q -o "$f" -d "$work"; done
          n=$(find "$work" -type f | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::extracted 0 files from the artifacts -- the guard never looked, refusing to publish"
            exit 1
          fi
          echo "scanning $n extracted file(s) from ${#sdists[@]} sdist(s) + ${#wheels[@]} wheel(s)"
          # THE PATTERN IS NOT STORED HERE. Inline and self-exempted, it made this
          # public file publish the internal naming scheme the gate exists to keep
          # out. Terms are base64-encoded in .github/leak-patterns.b64 -- obfuscation,
          # not secrecy, but a code search no longer answers with the list. Fail
          # closed on missing/undecodable: an empty ERE matches every line.
          PATFILE=.github/leak-patterns.b64
          if [ ! -s "$PATFILE" ]; then
            echo "::error::$PATFILE missing or empty -- refusing to publish with no denylist"
            exit 1
          fi
          PAT_CORE=$(sed -n 's/^core=//p' "$PATFILE" | base64 -d)
          PAT_EXTRA=$(sed -n 's/^artifact=//p' "$PATFILE" | base64 -d)
          if [ -z "$PAT_CORE" ]; then
            echo "::error::could not decode a core pattern from $PATFILE -- refusing to publish unscanned"
            exit 1
          fi
          PAT="$PAT_CORE${PAT_EXTRA:+|$PAT_EXTRA}"
          set +e
          out=$(grep -rIaEn "$PAT" "$work")
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::artifact leak scan errored (rc=2) — refusing to publish unscanned"
            exit 1
          fi
          # One narrow exception: the Apache copyright line names the owning entity
          # and cannot carry an allow marker, because LICENSE ships verbatim as legal
          # text. Exempt that ONE line only -- matched by position and shape, not by
          # the name on it, so it keeps working if the holder ever changes. Any other
          # line of LICENSE, and every other file, still fails the job.
          hits=$(printf '%s\n' "$out" | grep -Fv 'leak-scan:allow' | grep -vE '/LICENSE:[0-9]+:[[:space:]]*Copyright [0-9]{4} ' | grep -v '^$' || true)
          if [ -n "$hits" ]; then
            # file:line + count only — never matched text (public Actions logs).
            echo "INTERNAL REFS (file:line only — content withheld):"
            printf '%s\n' "$hits" | sed -E 's/^([^:]+:[0-9]+):.*/\1/' | sort | uniq -c
            n=$(printf '%s\n' "$hits" | grep -c . || true)
            echo "::error::$n internal reference hit(s) in build artifacts; scrub failed, refusing to publish"
            exit 1
          fi
          echo "artifact leak scan: clean"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Pin release/v1 branch tip (immutable). Update deliberately; do not float.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
