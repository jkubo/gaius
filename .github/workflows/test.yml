name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every Python x MCP major cell must finish. The default cancels the rest.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        mcp-version: ["1", "2"]

    steps:
      # Pin full commit SHAs (mutable tags rejected by supply-chain residual).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the push-range scan below diffs the newly-pushed commits,
          # and the default fetch-depth of 1 has no parent objects to diff against.
          # This does NOT weaken the worktree scan — that step excludes .git.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
          # The mcp extra is >=1.28.1,<3. The selected major has to be part of
          # this install: a later pin is a second resolution, and the wide extra
          # would already have chosen one major.
          case "${{ matrix.mcp-version }}" in
            1) MCP_RANGE='mcp>=1.28.1,<2' ;;
            2) MCP_RANGE='mcp>=2.0.0,<3' ;;
            *)
              echo "FAIL: no compatible range for mcp-version ${{ matrix.mcp-version }}"
              exit 1
              ;;
          esac
          echo "mcp-version ${{ matrix.mcp-version }} range ${MCP_RANGE}"
          # gaius entrypoint + mcp/fastapi for the attribution tests
          pip install -e ".[mcp,http]" "${MCP_RANGE}"

      - name: Require installed MCP SDK major ${{ matrix.mcp-version }}
        env:
          MCP_VERSION: ${{ matrix.mcp-version }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          installed = version("mcp")
          expected = os.environ["MCP_VERSION"]
          major = installed.split(".", 1)[0]
          print(f"installed mcp {installed} (matrix mcp-version {expected})")
          if major != expected:
              raise SystemExit(
                  f"FAIL: installed mcp {installed} does not match matrix mcp-version {expected}"
              )
          PY

      - name: Install semantic extras (optional — skip if unavailable)
        run: pip install "sentence-transformers>=2.7" "sqlite-vec>=0.1" || true

      - name: Run tests
        env:
          GAIUS_CONFIG: /dev/null
        run: pytest tests/ -v --tb=short

      - name: Run injection benchmark (bundled demo corpus)
        run: python benchmarks/bench_inject.py

      - name: Check for hardcoded deployment paths in shipped code
        run: |
          # Hardcoded absolute home paths and specific production domains must not appear
          # in shipped Python source. Config-driven substitutes belong in ~/.gaius/config.yaml.
          #
          # SOURCES must list only paths that exist in the published tree. grep exits 2 on a
          # missing path, and a bare `if grep ...; then fail; fi` reads that error as "no
          # matches" — which silently disabled this gate: http_adapter.py was dropped from the
          # mirror (b7dab4b) but left in SOURCES, so the step printed OK while a planted
          # /home/<user>/ string in gaius/ went unreported. Hence the explicit rc=2 fail-closed
          # branch below — do not collapse it back into `if grep`.
          # gaius/ is recursive, so gaius/presets/*.yaml is covered without a separate entry.
          #
          # SOURCES and --include are two INDEPENDENT filters: a path listed in SOURCES is
          # still discarded unless some --include matches it. gaius_cli, mnemosyne and
          # mnemos-audit are extensionless, so --include="*.py" silently filtered them back
          # out -- a planted leak in gaius_cli alone returned rc=1 "OK". That mattered most
          # for gaius_cli, the one shipped file known to carry an absolute path pre-scrub
          # (the dev tree's shebang), which `make publish` rewrites (Makefile: "shebang:
          # gaius_cli normalized").
          # PATTERN PARITY with the Makefile's publish-time leak scan is the point of this
          # step. It previously matched only absolute /home roots and one production
          # domain, which is strictly weaker than the publish scan: every private path in
          # this tree is written ~-rooted, so home-relative maintainer paths and the
          # private org name all passed this gate and were caught only by `make publish`.
          # A green run here never meant "safe to push". Keep this pattern, the --include
          # set, and the leak-scan:allow handling in sync with that scan.
          #
          # NOTE: describe additions in the abstract, never by quoting the literal
          # string -- a comment naming what the pattern hunts makes this file
          # self-match, and on a public repo that turns the gate into the leak.
          #
          # THE PATTERN IS NOT STORED HERE. It used to be, inline and self-exempted
          # with an allow marker, which meant this file published the entire internal
          # naming scheme the gate exists to keep out -- one code search on the repo
          # returned the whole set. The terms now live base64-encoded in
          # .github/leak-patterns.b64 (see the header in that file). That is
          # OBFUSCATION, NOT SECRECY -- it is one command to decode -- but the file no
          # longer *answers* a grep or a GitHub code search, and the authoritative
          # denylist remains the maintainer-side publish scan, which never ships.
          # Fail closed on a missing file or an empty decode: an empty ERE matches
          # every line, which would read as "everything is a hit", not as "clean".
          #
          # Scan the whole checkout, not just gaius/: this repo IS the published tree, and
          # the configs most likely to carry an internal endpoint (*.json, *.yml) live at
          # the root. tests/ is deliberately INCLUDED -- fixtures ship.
          PATFILE=.github/leak-patterns.b64
          if [ ! -s "$PATFILE" ]; then
            echo "FAIL: $PATFILE missing or empty — refusing to scan with no denylist"
            exit 1
          fi
          INTERNAL=$(sed -n 's/^core=//p' "$PATFILE" | base64 -d)
          if [ -z "$INTERNAL" ]; then
            echo "FAIL: could not decode a core pattern from $PATFILE — not the same as clean"
            exit 1
          fi
          set +e
          out=$(grep -rInE "$INTERNAL" . \
                  --include='*.py' --include='*.md' --include='*.yaml' --include='*.yml' \
                  --include='*.json' --include='*.toml' --include='*.sh' \
                  --include='gaius_cli' --include='mnemosyne' --include='mnemos-audit' \
                  --exclude-dir=.git --exclude-dir=__pycache__ --exclude-dir=build)
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "FAIL: scan errored (rc=2) — could not read a path. Not the same as clean."
            exit 1
          fi
          # A line may carry an allow marker (one shipped CLI default is a generic
          # home-relative repo root and legitimately matches). Allowlisted lines are
          # PRINTED, never silently dropped -- a marker slapped on a real leak must
          # stay visible every run. Describe such exceptions in the abstract: naming
          # the matching text here would make this comment self-match, which is the
          # bug that put the whole denylist in a public file in the first place.
          allow=$(printf '%s\n' "$out" | grep -F 'leak-scan:allow' || true)
          hits=$(printf '%s\n' "$out" | grep -Fv 'leak-scan:allow' | grep -v '^$' || true)
          if [ -n "$allow" ]; then
            echo "ALLOWLISTED (marker present -- re-review each; file:line only):"
            # Never print matched text — public Actions logs are world-readable ~90d.
            printf '%s\n' "$allow" | sed -E 's/^([^:]+:[0-9]+):.*/\1/' | sort | uniq -c
          fi
          if [ -n "$hits" ]; then
            echo "INTERNAL REFS (file:line only — content withheld):"
            printf '%s\n' "$hits" | sed -E 's/^([^:]+:[0-9]+):.*/\1/' | sort | uniq -c
            n=$(printf '%s\n' "$hits" | grep -c . || true)
            echo "FAIL: $n internal reference hit(s) found in the published tree"
            exit 1
          fi
          echo "OK: no internal references found"

      - name: Check newly-pushed commits for internal references
        run: |
          # WHY THIS EXISTS, SEPARATELY FROM THE WORKTREE SCAN ABOVE.
          # The step above scans the CHECKED-OUT TREE. That is the right unit for "is what
          # we publish clean", and it is the only unit that matters for the sdist. But it is
          # structurally blind to git HISTORY: a commit that adds an internal string and a
          # later commit that removes it leaves a clean worktree and a permanently public
          # blob. GitHub keeps unreachable commits SHA-addressable, force-push does not
          # retract, and mirrors/archives copy them — so by the time the worktree scan is
          # green the disclosure is already unretractable.
          #
          # SCOPE IS DELIBERATELY *NEW COMMITS ONLY*, AND *ADDED LINES ONLY*.
          # This repo's existing history carries unmarked hits. A gate that scanned all of
          # history would be red on every run from the day it landed, and a permanently-red
          # gate gets deleted or --no-verify'd within a week — which is strictly worse than
          # no gate, because the red is then read as "known noise" and a REAL hit hides in
          # it. Existing history is a separate, accepted, documented exposure; rewriting it
          # was evaluated and rejected (rewrites every SHA, breaks tags/releases, and still
          # does not retract). This gate's job is to stop the NEXT one.
          #
          # Same content-withholding rule as above: print file:line, NEVER the matched text.
          # Actions logs on a public repo are world-readable for ~90 days, so a gate that
          # echoed its own match would be the disclosure it exists to prevent.
          PATFILE=.github/leak-patterns.b64
          if [ ! -s "$PATFILE" ]; then
            echo "FAIL: $PATFILE missing or empty — refusing to scan with no denylist"
            exit 1
          fi
          INTERNAL=$(sed -n 's/^core=//p' "$PATFILE" | base64 -d)
          if [ -z "$INTERNAL" ]; then
            echo "FAIL: could not decode a core pattern from $PATFILE — not the same as clean"
            exit 1
          fi

          # Establish the range. push: what this push added. pull_request: what the PR adds
          # (three-dot, from the merge-base — two-dot would also drag in main-side commits
          # the PR did not author and blame the PR for them).
          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              TIP="${{ github.event.pull_request.head.sha }}"
              SPEC="$BASE...$TIP" ;;
            push)
              BASE="${{ github.event.before }}"
              TIP="${{ github.sha }}"
              SPEC="$BASE..$TIP" ;;
            *)
              echo "FAIL: unsupported event ${{ github.event_name }} — refusing to guess a range"
              exit 1 ;;
          esac

          ZERO=0000000000000000000000000000000000000000
          if [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # Branch creation, or a force-push that orphaned the old tip. Degrade to the head
            # commit alone and SAY SO — a narrowed scan reported as a pass is the failure mode
            # this repo has already been bitten by (a gate that errored and read as "clean").
            echo "NOTE: base $BASE is unresolvable (branch creation or force-push)."
            echo "      Degrading to the head commit alone. THIS SCANS LESS THAN THE FULL RANGE."
            if git rev-parse --verify -q "${TIP}^" >/dev/null; then
              DIFF=$(git diff --unified=0 "${TIP}^" "$TIP")
            else
              DIFF=$(git show --format= --unified=0 "$TIP")   # root commit
            fi
          else
            DIFF=$(git diff --unified=0 "$SPEC")
          fi

          if [ -z "$DIFF" ]; then
            echo "OK: no added lines in range ($SPEC)"
            exit 0
          fi

          # Attribute every ADDED line to file:line by tracking the +++ header and the hunk
          # header's new-side start. -U0 means no context lines, so only +/- and headers.
          # Emit file:line:content and let grep -E apply the pattern, so the regex engine is
          # byte-identical to the worktree scan above (pattern parity is the whole point —
          # two gates with two engines is two different denylists).
          added=$(printf '%s\n' "$DIFF" | awk '
            /^\+\+\+ /  { f = substr($0, 7); next }
            /^@@ /      { m = $3; sub(/^\+/, "", m); split(m, a, ","); ln = a[1] + 0; next }
            /^\+/       { print f ":" ln ":" substr($0, 2); ln++; next }
          ')

          set +e
          out=$(printf '%s\n' "$added" | grep -E "$INTERNAL")
          rc=$?
          set -e
          # grep rc: 0=match, 1=no match, >=2=error. Only 1 is "clean".
          if [ "$rc" -ge 2 ]; then
            echo "FAIL: range scan errored (rc=$rc). Not the same as clean."
            exit 1
          fi

          allow=$(printf '%s\n' "$out" | grep -F 'leak-scan:allow' || true)
          hits=$(printf '%s\n' "$out" | grep -Fv 'leak-scan:allow' | grep -v '^$' || true)
          if [ -n "$allow" ]; then
            echo "ALLOWLISTED in this range (marker present — re-review each; file:line only):"
            printf '%s\n' "$allow" | sed -E 's/^([^:]+:[0-9]+):.*/\1/' | sort | uniq -c
          fi
          if [ -n "$hits" ]; then
            echo "INTERNAL REFS ADDED BY THIS PUSH (file:line only — content withheld):"
            printf '%s\n' "$hits" | sed -E 's/^([^:]+:[0-9]+):.*/\1/' | sort | uniq -c
            n=$(printf '%s\n' "$hits" | grep -c . || true)
            echo "FAIL: $n internal reference(s) introduced in $SPEC"
            echo "      Do NOT 'fix' this by adding a follow-up commit that deletes the line —"
            echo "      the blob stays public and SHA-addressable. Rewrite the branch before merge."
            exit 1
          fi
          echo "OK: no internal references introduced in $SPEC"
